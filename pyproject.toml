[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tep-sim"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.20", "tep==2.5.0"]

[tool.setuptools.package-data]
tep_sim = ["upstream_hashes.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "vendor/tep-sim-upstream/src"]
